---
name: Test
'on':
  - push
  - pull_request
jobs:
  test:
    defaults:
      run:
        shell: 'bash -l {0}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          show-progress: false
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: make test

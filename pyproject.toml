[project]
name = "avocado-agent"
version = "0.1.0"
description = "An agentic approach to automated specification generation for C programs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.1.71",
    "mcp>=1.27",
    "pytest>=9.0.3",
    "tree-sitter>=0.25.2",
    "tree-sitter-c>=0.24.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

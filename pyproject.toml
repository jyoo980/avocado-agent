[project]
name = "avocado-agent"
version = "0.1.0"
description = "An agentic approach to automated specification generation for C programs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk==0.2.105",
    "loguru>=0.7.3",
    "pytest>=9.0.3",
    "tree-sitter>=0.25.2",
    "tree-sitter-c>=0.24.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
avocado-construct-call-graph = "tools.construct_call_graph:main"
avocado-topological-order = "tools.get_topological_ordering_of_functions:main"
avocado-run-cbmc = "tools.run_cbmc:main"
avocado-get-mutation-testing-kill-score = "tools.get_mutation_score:main"
save-session-metadata = "scripts.save_session_metadata:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
]

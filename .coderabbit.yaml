# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Adopted from: https://github.com/plume-lib/plume-scripts/blob/master/.coderabbit.yaml

language: "en-US"

reviews:
  profile: "assertive"
  high_level_summary: false
  review_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  in_progress_fortune: false
  poem: false
  path_filters:
    - "!**/__init__.py"
    - "!**/test_*.py"
    - "!**/.claude/**"
    - "!eval/benchmarks/**"
    - "!test/data/**"
  auto_review:
    # Setting this value to 0 means CodeRabbit will review on every single new push, which drives me
    # insane. Stop reviewing after 3 new commits, then re-request review via @coderabbit review.
    auto_pause_after_reviewed_commits: 3
    ignore_title_keywords:
      - "wip"
      - "draft"
    ignore_usernames:
      - "dependabot"
      - "dependabot[bot]"
      - "mend"
      - "renovate"
      - "renovate[bot]"
  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"

chat:
  art: false
